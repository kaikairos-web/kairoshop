<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/LOGO.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - KairoShop</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass">
      <h1>Set New Password</h1>
      <p class="subtitle">Enter your new password below</p>
      <div id="error-msg" style="display:none;color:var(--danger);margin-bottom:1rem;text-align:center"></div>
      <form id="reset-form">
        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" class="form-control" required minlength="6" placeholder="Repeat password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submit-btn">Update Password</button>
      </form>
      <p style="text-align:center;margin-top:1rem"><a href="/login.html">← Back to Login</a></p>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/reset-password.js"></script>
</body>
</html>
