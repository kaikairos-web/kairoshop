<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — KairoShop</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card glass">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your KairoShop account</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
      </form>
      <p style="text-align:center;margin-top:1rem">
        <a href="#" id="forgot-link">Forgot password?</a>
      </p>
      <p style="text-align:center;margin-top:1rem" class="text-muted">
        No account? <a href="/register.html">Register</a>
      </p>
      <p style="text-align:center;margin-top:0.5rem"><a href="/index.html">? Home</a></p>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/auth.js"></script>
</body>
</html>
