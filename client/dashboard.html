<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — KairoShop</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div class="app-layout">
    <div id="user-sidebar"></div>
    <div class="main-content">
      <div id="mobile-header-wrap"></div>
      <h1 class="page-title">My Dashboard</h1>
      <div class="stats-grid" id="user-stats"></div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="profile">Profile</button>
        <button class="tab-btn" data-tab="orders">Orders</button>
        <button class="tab-btn" data-tab="wishlist">Wishlist</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </div>
      <div id="tab-profile" class="tab-panel active glass-card"></div>
      <div id="tab-orders" class="tab-panel glass-card table-wrap"></div>
      <div id="tab-wishlist" class="tab-panel product-grid"></div>
      <div id="tab-settings" class="tab-panel glass-card">
        <form id="settings-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="settings-name" class="form-control">
          </div>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
  <div id="bottom-nav"></div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/pages/dashboard.js"></script>
</body>
</html>
