<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/LOGO.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - KairoShop</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="public-page">
  <div id="site-header"></div>
  <main class="container section">
    <h1 class="page-title">Contact Us</h1>
    <div class="glass-card" style="max-width:560px">
      <form id="contact-form">
        <div class="form-group">
          <label>Name</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea class="form-control" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </main>
  <footer class="site-footer glass">&copy; 2026 KairoShop</footer>
  <div id="bottom-nav"></div>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Components.injectPublicLayout();
      const form = document.getElementById('contact-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('[type=submit]');
        btn.disabled = true;
        btn.textContent = 'Sending�';
        try {
          await API.post('/contact', {
            name: form.querySelector('input[type=text]').value,
            email: form.querySelector('input[type=email]').value,
            message: form.querySelector('textarea').value,
          });
          UI.toast('Message sent! We will reply soon.');
          form.reset();
        } catch (err) {
          UI.toast(err.message || 'Failed to send message.', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send Message';
        }
      });
    });
  </script>
</body>
</html>
