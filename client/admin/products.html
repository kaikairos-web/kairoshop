<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/assets/LOGO.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - KairoShop Admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="admin-layout">
  <div class="app-layout">
    <div id="admin-sidebar"></div>
    <div class="main-content">
      <div id="mobile-header-wrap"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem">
        <h1 class="page-title" style="margin:0">Product Management</h1>
        <button class="btn btn-primary" id="btn-add-product">+ Add Product</button>
      </div>
      <div class="glass-card table-wrap" id="admin-products-table"></div>
    </div>
  </div>

  <div class="modal-overlay" id="product-modal">
    <div class="modal glass">
      <div class="modal-header">
        <h2 id="modal-title">Add Product</h2>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="form-group"><label>Name</label><input id="product-name" class="form-control" required></div>
        <div class="form-group"><label>Description</label><textarea id="product-desc" class="form-control" rows="2"></textarea></div>
        <div class="form-group"><label>Category</label>
          <select id="product-category" class="form-control" required>
            <option>Bike Frames</option><option>Tires</option><option>Chains</option>
            <option>Helmets</option><option>Brakes</option><option>Accessories</option>
          </select>
        </div>
        <div class="form-group"><label>Price</label><input type="number" step="0.01" id="product-price" class="form-control" required></div>
        <div class="form-group"><label>Stock</label><input type="number" id="product-stock" class="form-control" required></div>
        <div class="form-group"><label>Rating</label><input type="number" step="0.1" min="0" max="5" id="product-rating" class="form-control" value="4"></div>
        <div class="form-group">
          <label>Product Image</label>
          <input type="file" id="product-file" accept="image/*" class="form-control">
          <div id="image-preview-wrap" style="margin-top:0.75rem;display:none">
            <img id="image-preview" src="" alt="Preview" style="max-height:120px;border-radius:8px;object-fit:cover;">
          </div>
        </div>
        <input type="hidden" id="product-image">
        <button type="submit" class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/admin-products.js"></script>
</body>
</html>
