<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — KairoShop</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body class="admin-layout">
  <div class="app-layout">
    <div id="admin-sidebar"></div>
    <div class="main-content">
      <div id="mobile-header-wrap"></div>
      <h1 class="page-title">Admin Dashboard</h1>
      <div class="stats-grid" id="admin-stats"></div>
      <div class="dashboard-grid">
        <div class="chart-container glass-card">
          <h3 style="margin-bottom:1rem">Sales Overview</h3>
          <canvas id="sales-chart"></canvas>
        </div>
        <div class="chart-container glass-card">
          <h3 style="margin-bottom:1rem">Products by Category</h3>
          <canvas id="category-chart"></canvas>
        </div>
      </div>
      <div class="glass-card" style="margin-top:1.5rem">
        <h3 style="margin-bottom:1rem">Recent Orders</h3>
        <div class="table-wrap" id="recent-orders"></div>
      </div>
      <div class="glass-card" style="margin-top:1.5rem">
        <h3 style="margin-bottom:1rem">Low Stock Alert</h3>
        <div id="low-stock"></div>
      </div>
    </div>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/admin-dashboard.js"></script>
</body>
</html>
